<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link href="styles.css" rel="stylesheet"/>
    <title>Calculator</title>
</head>
<body>
    <div class="box">
        <div class="screen">
            <div id="first-row">
                <span><button id="memory-btn" class="memory-btn">Memory</button></span>
                <span class="term screens" id="term"></span>
            </div>
            <div id="memory-box" class="memory-box"></div>
            <div class="input screens" id="input"></div>
        </div>
        <div class="grid-container" id="grid1">
            <button class="klammer-auf" id="klammer-auf">(</button>
            <button class="klammer-zu" id="klammer-zu">)</button>
            <button class="redo" id="redo"><--</button>
            <button class="AC">AC</button>
            <button class="seven number">7</button>
            <button class="eight number">8</button>
            <button class="nine number">9</button>
            <button class="backslash operatoren">/</button>
            <button class="four number">4</button>
            <button class="five number">5</button>
            <button class="six number">6</button>
            <button class="x operatoren">x</button>
            <button class="one number">1</button>
            <button class="two number">2</button>
            <button class="three number">3</button>
            <button class="minus operatoren">-</button>
            <button class="dot" id="dot">.</button>
            <button class="zero" id="zero">0</button>
            <button class="equals" id="equals">=</button>
            <button class="plus operatoren">+</button>
        </div>
        <div class="grid2" id="grid2" >
            <button class="e" id="e">e</button>
            <button class="pi" id="pi">&pi;</button>
            <button class="fakultät" id="fakultät">x!</button>
            <button class="quadrat" id="quadrat">x<sup>2</sup></button>
            <button class="wurzel" id="wurzel">&radic;</button>
            <button class="x-hoch-y" id="x-hoch-y">x<sup>y</sup></button>
            <button class="y-wurzel-x" id="y-wurzel-x"><sup>n</sup>&#8730;x</button>
            <button class="ln" id="ln">ln</button>
            <button class="sin trig" id="sin">sin</button>
            <button class="cos trig" id="cos">cos</button>
            <button class="tan trig" id="tan">tan</button>
            <button class="arcsin" id="arcsin">sin<sup>-1</sup></button>
            <button class="arccos" id="arccos">cos<sup>-1</sup></button>
            <button class="arctan" id="arctan">tan<sup>-1</sup></button>
            <button class="rad" id="rad-deg">Rad</button>
        </div>
    </div>
    <div class="switch-button-div first-row">
        <button class="switch-button" id="switch-button">Fx</button>
    </div>
        <footer>Created by Willi</footer>
    <script src="calculator.js"></script>
</body>
</html>
